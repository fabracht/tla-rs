[package]
name = "tla-checker"
version = "0.4.5"
edition = "2024"
description = "A TLA+ model checker written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fabracht/tla-rs"
keywords = ["tla", "model-checking", "formal-verification"]
categories = ["command-line-utilities", "development-tools"]
default-run = "tla"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "tla_checker"
path = "src/lib.rs"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "tla"
path = "src/main.rs"

[[bin]]
name = "tla-mcp"
path = "src/bin/tla_mcp.rs"
# Disabled to avoid duplicate-output warnings when the lib is built as both rlib and cdylib;
# cargo test --release also failed to link tla-mcp under lto = "fat" with cdylib in the default crate-type.
test = false
bench = false
doctest = false

[features]
default = []
wasm = ["wasm-bindgen", "serde"]
profiling = []
dhat = ["dep:dhat"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
strip = false

[profile.profiling]
inherits = "release"
debug = 2
lto = false
codegen-units = 1
split-debuginfo = "packed"

[dependencies]
fastrand = "2.4"
indexmap = "2.13.0"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = "1.0"
dhat = { version = "0.3.3", optional = true }
stacker = "0.1.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
rmcp = { version = "1.7.0", features = ["transport-io"] }
schemars = "1.2.1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "model_checking"
harness = false
