[tasks.install]
command = "cargo"
args = ["install", "--path", ".", "--force"]

[tasks.wasm]
description = "Build wasm package for npm"
dependencies = ["wasm-clean", "wasm-build", "wasm-bindgen", "wasm-package"]

[tasks.wasm-clean]
description = "Clean pkg directory"
script = ["rm -rf pkg"]

[tasks.wasm-build]
command = "cargo"
args = ["rustc", "--lib", "--release", "--target", "wasm32-unknown-unknown", "--features", "wasm", "--crate-type", "cdylib"]

[tasks.wasm-bindgen]
description = "Run wasm-bindgen with the CLI version pinned to the wasm-bindgen crate in Cargo.lock"
dependencies = ["wasm-build"]
script = [
    '''
    set -e
    VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; print; exit}' Cargo.lock | sed 's/.*"\(.*\)".*/\1/')
    if [ -z "$VERSION" ]; then
        echo "could not determine the wasm-bindgen version from Cargo.lock"
        exit 1
    fi
    BIN=$(command -v wasm-bindgen || true)
    if [ -z "$BIN" ] || [ "$("$BIN" --version | awk '{print $2}')" != "$VERSION" ]; then
        LOCAL="$PWD/.wasm-tools/bin/wasm-bindgen"
        if [ ! -x "$LOCAL" ] || [ "$("$LOCAL" --version 2>/dev/null | awk '{print $2}')" != "$VERSION" ]; then
            echo "installing wasm-bindgen-cli $VERSION to match Cargo.lock (project-local)..."
            cargo install wasm-bindgen-cli --version "$VERSION" --root "$PWD/.wasm-tools" --force
        fi
        BIN="$LOCAL"
    fi
    echo "using $("$BIN" --version)"
    "$BIN" --target web --out-dir pkg target/wasm32-unknown-unknown/release/tla_checker.wasm
    '''
]

[tasks.wasm-package]
description = "Generate package.json and copy README into pkg"
dependencies = ["wasm-bindgen"]
script = [
    '''
    VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
    cat > pkg/package.json << PKGJSON
{
  "name": "tla-checker",
  "version": "$VERSION",
  "type": "module",
  "description": "A TLA+ model checker compiled to WebAssembly",
  "license": "MIT OR Apache-2.0",
  "repository": {
    "type": "git",
    "url": "git+https://github.com/fabracht/tla-rs.git"
  },
  "main": "tla_checker.js",
  "types": "tla_checker.d.ts",
  "files": [
    "tla_checker_bg.wasm",
    "tla_checker.js",
    "tla_checker.d.ts",
    "tla_checker_bg.wasm.d.ts"
  ],
  "keywords": [
    "tla",
    "model-checking",
    "formal-verification",
    "wasm"
  ],
  "sideEffects": [
    "./snippets/*"
  ]
}
PKGJSON
    cp README.md pkg/README.md
    cd pkg && npm pkg fix
    '''
]

[tasks.wasm-publish]
description = "Build and publish WASM package to npm"
dependencies = ["wasm"]
script = [
    '''
    echo "Publishing WASM package to npm..."
    cd pkg
    npm publish
    echo "Published tla-checker to npm!"
    '''
]
