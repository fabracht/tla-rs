name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep "^version" Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Version already published, skipping"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if npm publish is needed
        id: npm-check
        run: |
          LOCAL_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NPM_VERSION=$(npm view tla-checker version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tla-checker $LOCAL_VERSION already published to npm, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing tla-checker $LOCAL_VERSION (npm has $NPM_VERSION)"
          fi

      - name: Install Rust
        if: steps.npm-check.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        if: steps.npm-check.outputs.skip == 'false'
        run: cargo install wasm-bindgen-cli

      - name: Setup Node.js
        if: steps.npm-check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish WASM package
        if: steps.npm-check.outputs.skip == 'false'
        run: |
          cargo build --lib --release --target wasm32-unknown-unknown --features wasm
          rm -rf pkg
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/tla_checker.wasm
          VERSION=${{ steps.npm-check.outputs.local }}
          cat > pkg/package.json << PKGJSON
          {
            "name": "tla-checker",
            "version": "$VERSION",
            "type": "module",
            "description": "A TLA+ model checker compiled to WebAssembly",
            "license": "MIT OR Apache-2.0",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/fabracht/tla-rs.git"
            },
            "main": "tla_checker.js",
            "types": "tla_checker.d.ts",
            "files": [
              "tla_checker_bg.wasm",
              "tla_checker.js",
              "tla_checker.d.ts",
              "tla_checker_bg.wasm.d.ts"
            ],
            "keywords": ["tla", "model-checking", "formal-verification", "wasm"],
            "sideEffects": [
              "./snippets/*"
            ]
          }
          PKGJSON
          cp README.md pkg/README.md
          cd pkg
          npm pkg fix
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    name: Build CLI Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            suffix: linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            suffix: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            suffix: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI binaries
        run: cargo build --release --bin tla --bin tla-mcp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          cp ./target/${{ matrix.target }}/release/tla${{ matrix.ext }} dist/tla-${{ matrix.suffix }}${{ matrix.ext }}
          cp ./target/${{ matrix.target }}/release/tla-mcp${{ matrix.ext }} dist/tla-mcp-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: [publish, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release_notes.md
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
