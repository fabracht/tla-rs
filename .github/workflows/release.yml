name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep "^version" Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Version already published, skipping"

  build-wasm:
    name: Build WASM engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build wasm engine
        run: |
          cargo rustc --lib --release --target wasm32-unknown-unknown --features wasm --crate-type cdylib
          WB_VERSION=$(cargo tree --features wasm | grep -oE 'wasm-bindgen v[0-9.]+' | head -1 | sed -E 's/^wasm-bindgen v//')
          if [ -z "$WB_VERSION" ]; then echo "could not determine resolved wasm-bindgen version"; exit 1; fi
          echo "Installing wasm-bindgen-cli $WB_VERSION to match the resolved dependency"
          cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/tla_checker.wasm

      - name: Upload wasm pkg
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: |
            pkg/tla_checker_bg.wasm
            pkg/tla_checker.js

  build-binaries:
    name: Build CLI Binaries
    needs: build-wasm
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            suffix: linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            suffix: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            suffix: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download wasm pkg
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg

      - name: Build tla (with embedded wasm engine)
        run: cargo build --release --bin tla --features embed-wasm --target ${{ matrix.target }}

      - name: Build tla-mcp
        run: cargo build --release --bin tla-mcp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          cp ./target/${{ matrix.target }}/release/tla${{ matrix.ext }} dist/tla-${{ matrix.suffix }}${{ matrix.ext }}
          cp ./target/${{ matrix.target }}/release/tla-mcp${{ matrix.ext }} dist/tla-mcp-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: [publish, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release_notes.md
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
